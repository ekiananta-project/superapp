<!DOCTYPE html>
<html lang="id" data-auth-guard="finance">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://eipviruaffujxsfpupki.supabase.co; connect-src 'self' https://eipviruaffujxsfpupki.supabase.co wss://eipviruaffujxsfpupki.supabase.co https://unpkg.com; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <script src="js/security/ruangkitha-log-guard.js?v=20260912-v200a49d"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0D0C">
  <meta name="application-name" content="RuangKitha">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RuangKitha">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <script src="js/theme.js"></script>
  <title>Tambah Transaksi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/pages/transaksi-category-picker.css?v=20260908-1">
  <style id="ruangkitha-auth-cloak">html[data-auth-guard] body{visibility:hidden!important}</style>
</head>
<body>
<div class="aplikasi">
  <header class="header-halaman">
  <a class="tombol-ikon" href="finance.html" data-kembali-transaksi aria-label="Kembali"><ion-icon name="arrow-back-outline"></ion-icon></a>
  <h1><span data-judul-form>Tambah Transaksi</span></h1>
  <span class="kosong"></span>
</header>
  <main class="konten-halaman">
    <div class="notifikasi" data-notifikasi hidden></div>
    <form class="formulir" data-form-transaksi>
      <div class="segmentasi">
        <button class="segmentasi-item" type="button" data-form-jenis="pengeluaran">Pengeluaran</button>
        <button class="segmentasi-item" type="button" data-form-jenis="pemasukan">Pemasukan</button>
        <button class="segmentasi-item" type="button" data-form-jenis="transfer">Transfer</button>
      </div>

      <div class="grup-input">
        <label for="tanggal">Tanggal</label>
        <input class="input" id="tanggal" name="tanggal" type="date" required>
      </div>

      <div class="grup-input">
        <label for="dompet" data-label-dompet>Dompet</label>
        <select class="pilih" id="dompet" name="dompet" required></select>
      </div>

      <div class="grup-input" data-grup-tujuan hidden>
        <label for="dompetTujuan">Dompet Tujuan</label>
        <select class="pilih" id="dompetTujuan" name="dompetTujuan"></select>
      </div>

      <div class="grup-input" data-grup-akun>
        <label for="akun">Kategori</label>
        <button class="category-picker-trigger" type="button" data-category-trigger aria-haspopup="dialog" aria-controls="category-picker-sheet">
          <span class="category-picker-trigger-copy">
            <strong data-category-selected>Pilih kategori</strong>
            <small data-category-selected-parent hidden></small>
          </span>
          <ion-icon name="chevron-down-outline"></ion-icon>
        </button>
        <select class="category-native-select" id="akun" name="akun" tabindex="-1" aria-hidden="true"></select>
      </div>

      <div class="grup-input">
        <label for="keterangan">Nama / Keterangan</label>
        <input class="input" id="keterangan" name="keterangan" placeholder="Contoh: Makan siang">
      </div>

      <div class="grup-input">
        <label for="jumlah">Nominal</label>
        <div class="input-uang"><span class="input-uang-prefix">Rp</span><input class="input" id="jumlah" name="jumlah" type="text" inputmode="numeric" autocomplete="off" placeholder="25.000" required></div>
      </div>

      <div class="grup-input" data-grup-biaya-transfer hidden>
        <label for="biayaAdmin">Biaya Admin <span aria-hidden="true">(opsional)</span></label>
        <div class="input-uang"><span class="input-uang-prefix">Rp</span><input class="input" id="biayaAdmin" name="biayaAdmin" type="text" inputmode="numeric" autocomplete="off" value="0" placeholder="0"></div>
      </div>

      <div class="grup-input" data-grup-mode-biaya hidden>
        <label for="modeBiaya">Cara Biaya Admin</label>
        <select class="pilih" id="modeBiaya" name="modeBiaya">
          <option value="added">Ditambahkan ke nominal</option>
          <option value="deducted">Dipotong dari nominal transfer</option>
        </select>
      </div>

      <div class="notifikasi" data-ringkasan-transfer hidden></div>

      <button class="tombol-utama" type="submit">Simpan Transaksi</button>
    </form>
  </main>
</div>
<!-- Custom category picker: memakai data kategori yang sudah dimuat/cached oleh transaksi-backend.js. -->
<div class="category-picker-layer" data-category-layer hidden>
  <section class="category-picker-sheet" id="category-picker-sheet" role="dialog" aria-modal="true" aria-labelledby="category-picker-title">
    <div class="category-picker-handle" aria-hidden="true"></div>
    <div class="category-picker-header">
      <div>
        <h2 id="category-picker-title">Pilih Kategori</h2>
        <p>Pilih kategori utama atau subkategori.</p>
      </div>
      <button class="category-picker-close" type="button" data-category-close aria-label="Tutup pemilih kategori">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </div>
    <label class="category-picker-search">
      <ion-icon name="search-outline"></ion-icon>
      <input type="search" inputmode="search" autocomplete="off" placeholder="Cari kategori..." data-category-search>
    </label>
    <div class="category-picker-list" data-category-list></div>
  </section>
</div>

<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

<!-- Supabase + Service Layer -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="js/backend/supabase.js"></script>
<script src="js/backend/auth-service.js?v=20260912-v200a49d"></script>
<script src="js/backend/family-service.js"></script>
<script src="js/backend/finance-service.js?v=20260908-1"></script>
<script src="js/backend/finance-cache.js"></script>
<script src="js/backend/auth-router.js?v=20260912-v200a49d"></script>
<script src="js/backend/auth-guard.js?v=20260912-v200a49d"></script>

<!-- Form transaksi backend: CREATE + EDIT expense/income/transfer + biaya admin transfer. Jangan load js/app.js di halaman ini. -->
<script src="js/pages/transaksi-backend.js?v=20260909-v200a"></script>
<script src="js/pwa.js?v=20260912-v200a49d"></script>
</body>
</html>
