<!DOCTYPE html>
<html lang="id" data-auth-guard="family">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0D0C">
  <meta name="application-name" content="RuangKitha">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RuangKitha">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <script src="js/theme.js"></script>
  <title>Folder Catatan · RuangKitha</title>

  <link rel="preconnect" href="https://eipviruaffujxsfpupki.supabase.co" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/pages/catatan-home.css?v=20260909-v200a21">
  <link rel="stylesheet" href="css/pages/catatan-area.css?v=20260909-v200a21">
  <style id="ruangkitha-auth-cloak">html[data-auth-guard] body{visibility:hidden!important}</style>
</head>
<body>
<div class="aplikasi dengan-nav catatan-home catatan-area catatan-folder-area" data-catatan-folder aria-busy="true">
  <header class="header-halaman catatan-standard-header">
    <a class="catatan-back-ruangkitha" href="catatan.html" data-folder-back aria-label="Kembali ke Catatan">
      <ion-icon name="arrow-back-outline" aria-hidden="true"></ion-icon>
      <span>Catatan</span>
    </a>
    <span class="kosong" aria-hidden="true"></span>
    <h1 data-folder-area-title>Catatan</h1>
    <span class="kosong" aria-hidden="true"></span>
  </header>

  <section class="catatan-member-name-container" data-folder-member-container hidden>
    <strong data-folder-member-name>Anggota</strong>
  </section>

  <section class="catatan-folder-name-container" aria-label="Nama folder">
    <strong data-folder-name>Folder</strong>
  </section>

  <main class="catatan-area-main">
    <section class="catatan-search-section" aria-label="Pencarian dalam folder" data-folder-search-section>
      <label class="catatan-search-box" for="catatan-folder-search">
        <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
        <input id="catatan-folder-search" type="search" inputmode="search" autocomplete="off"
          placeholder="Cari di folder..." aria-label="Cari di folder">
      </label>
    </section>

    <section class="catatan-area-section catatan-notes-section" aria-labelledby="catatan-folder-notes-title">
      <div class="catatan-area-heading"><h2 id="catatan-folder-notes-title">Catatan</h2></div>

      <div class="catatan-note-grid" data-folder-note-grid>
        <button class="catatan-note-card" type="button" data-folder-note data-search-text="ide utama catatan referensi rencana">
          <span class="catatan-note-type"><ion-icon name="document-text-outline" aria-hidden="true"></ion-icon></span>
          <strong>Catatan utama</strong>
          <span class="catatan-note-preview">Contoh catatan yang tersimpan di dalam folder ini dan tetap memakai tampilan dua kolom.</span>
          <span class="catatan-note-tags"><em>#catatan</em></span>
          <small data-folder-access>Diedit terakhir · 14.30</small>
        </button>

        <button class="catatan-note-card" type="button" data-folder-note data-search-text="checklist daftar kebutuhan selesai folder">
          <span class="catatan-note-type"><ion-icon name="checkbox-outline" aria-hidden="true"></ion-icon></span>
          <strong>Daftar singkat</strong>
          <span class="catatan-note-special">2 / 5 selesai</span>
          <span class="catatan-note-preview">Checklist tetap tampil compact tanpa mengubah struktur halaman di dalam folder.</span>
          <span class="catatan-note-tags"><em>#daftar</em></span>
          <small data-folder-access>Diedit terakhir · Kemarin</small>
        </button>

        <button class="catatan-note-card" type="button" data-folder-note data-search-text="reminder pengingat jadwal besok folder">
          <span class="catatan-note-type"><ion-icon name="notifications-outline" aria-hidden="true"></ion-icon></span>
          <strong>Pengingat</strong>
          <span class="catatan-note-special">Besok · 19.00</span>
          <span class="catatan-note-preview">Reminder di folder tetap menjadi catatan biasa dalam kelompok utama yang sama.</span>
          <span class="catatan-note-tags"><em>#ingat</em></span>
          <small data-folder-access>Reminder aktif</small>
        </button>

        <button class="catatan-note-card" type="button" data-folder-note data-search-text="referensi ide detail catatan folder">
          <span class="catatan-note-type"><ion-icon name="bulb-outline" aria-hidden="true"></ion-icon></span>
          <strong>Referensi</strong>
          <span class="catatan-note-preview">Contoh catatan lain untuk memastikan grid tetap terasa sama seperti halaman area utama.</span>
          <span class="catatan-note-tags"><em>#referensi</em></span>
          <small data-folder-access>Diedit terakhir · Senin</small>
        </button>
      </div>

      <div class="catatan-area-empty" data-search-empty hidden>
        <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
        <strong>Tidak ada yang cocok</strong>
        <span data-folder-empty-copy>Coba kata kunci lain di folder ini.</span>
      </div>
    </section>
  </main>

  <nav class="catatan-bottom-nav" aria-label="Navigasi Catatan">
    <a class="catatan-nav-item is-active" href="catatan.html">
      <ion-icon name="home-outline" aria-hidden="true"></ion-icon><span>Home</span>
    </a>
    <button class="catatan-nav-item" type="button" data-nav-placeholder="Dipin">
      <ion-icon name="pin-outline" aria-hidden="true"></ion-icon><span>Dipin</span>
    </button>
    <button class="catatan-add-button" type="button" data-create-note aria-label="Buat catatan baru">
      <ion-icon name="add-outline" aria-hidden="true"></ion-icon>
    </button>
    <button class="catatan-nav-item" type="button" data-nav-placeholder="Arsip">
      <ion-icon name="archive-outline" aria-hidden="true"></ion-icon><span>Arsip</span>
    </button>
  </nav>

  <div class="catatan-toast" data-catatan-toast role="status" hidden></div>

  <div class="catatan-sheet-layer" data-create-layer hidden>
    <section class="catatan-sheet" role="dialog" aria-modal="true" aria-labelledby="catatan-folder-create-title">
      <div class="catatan-sheet-handle" aria-hidden="true"></div>
      <div class="catatan-sheet-header">
        <div><small data-create-context>Folder</small><h2 id="catatan-folder-create-title" data-create-title>Apa yang ingin dibuat?</h2></div>
        <button class="catatan-sheet-close" type="button" data-create-close aria-label="Tutup"><ion-icon name="close-outline" aria-hidden="true"></ion-icon></button>
      </div>

      <div class="catatan-create-step" data-create-step="scope" hidden>
        <button class="catatan-create-option" type="button" data-create-scope="family">
          <span class="catatan-create-icon"><ion-icon name="people-outline"></ion-icon></span>
          <span><strong>Catatan Keluarga</strong><small>Dapat dilihat dan diedit semua anggota.</small></span>
          <ion-icon name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>
        <button class="catatan-create-option" type="button" data-create-scope="personal">
          <span class="catatan-create-icon"><ion-icon name="person-outline"></ion-icon></span>
          <span><strong>Catatan Pribadi</strong><small>Buat di ruang pribadi milik kamu.</small></span>
          <ion-icon name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>

      <div class="catatan-create-step" data-create-step="type">
        <button class="catatan-create-option" type="button" data-create-type="Catatan Biasa">
          <span class="catatan-create-icon"><ion-icon name="document-text-outline"></ion-icon></span>
          <span><strong>Catatan Biasa</strong><small>Tulis informasi, ide, atau hal yang ingin disimpan.</small></span>
          <ion-icon name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>
        <button class="catatan-create-option" type="button" data-create-type="Checklist">
          <span class="catatan-create-icon"><ion-icon name="checkbox-outline"></ion-icon></span>
          <span><strong>Checklist</strong><small>Buat daftar yang dapat ditandai satu per satu.</small></span>
          <ion-icon name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>
        <button class="catatan-create-option" type="button" data-create-type="Reminder">
          <span class="catatan-create-icon"><ion-icon name="notifications-outline"></ion-icon></span>
          <span><strong>Reminder</strong><small>Buat catatan dengan tanggal dan pengingat.</small></span>
          <ion-icon name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>
    </section>
  </div>
</div>

<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/backend/supabase.js"></script>
<script src="js/backend/auth-service.js"></script>
<script src="js/backend/family-service.js?v=20260908-10"></script>
<script src="js/backend/auth-router.js?v=20260909-v200a8"></script>
<script src="js/backend/auth-guard.js?v=20260909-v200a8"></script>
<script src="js/backend/notes-service.js?v=20260910-v200a32"></script>
<script src="js/pages/catatan-folder.js?v=20260910-v200a32"></script>
<script src="js/pwa.js?v=20260910-v200a32"></script>
</body>
</html>
