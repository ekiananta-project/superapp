<!DOCTYPE html>
<html lang="id" data-auth-guard="finance">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0D0C">
  <meta name="application-name" content="Family Superapp">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Family">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <script src="js/theme.js"></script>
  <title>Daftar Transaksi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components/finance-period.css?v=20260908-1">
  <link rel="stylesheet" href="css/pages/dompet-detail.css?v=20260908-3">
  <link rel="stylesheet" href="css/pages/dompet-backend.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div class="aplikasi">
  <header class="header-halaman">
    <a class="tombol-ikon" href="index.html" aria-label="Kembali"><ion-icon name="arrow-back-outline"></ion-icon></a>
    <h1>Daftar Transaksi</h1>
    <span class="kosong"></span>
  </header>

  <main class="konten-halaman detail-dompet" data-daftar-transaksi-root>
    <button class="pemilih-dompet-detail" type="button" data-detail-buka-dompet>
      <span class="pemilih-dompet-detail-kiri">
        <span class="pemilih-dompet-detail-ikon"><ion-icon data-pemilih-dompet-ikon name="wallet-outline"></ion-icon></span>
        <span><small>Dompet</small><strong data-pemilih-dompet-nama>Dompet</strong></span>
      </span>
      <ion-icon name="chevron-down-outline"></ion-icon>
    </button>

    <section class="dompet-detail-saldo-compact">
      <span class="dompet-detail-label">Saldo saat ini</span>
      <div class="dompet-detail-saldo-row">
        <h2 data-detail-nama>Dompet</h2>
        <strong data-detail-saldo>Rp 0</strong>
      </div>
    </section>

    <div class="dompet-detail-toolbar-row">
      <a class="tombol-laporan-dompet tombol-laporan-dompet-compact" href="laporan-dompet.html" data-laporan-dompet>
        <span class="tombol-laporan-dompet-kiri">
          <ion-icon name="stats-chart-outline"></ion-icon>
          <span>Laporan Dompet</span>
        </span>
        <ion-icon name="arrow-forward-outline"></ion-icon>
      </a>

      <button class="finance-period-trigger finance-period-trigger-compact" type="button" data-finance-period-trigger>
        <span class="finance-period-trigger-main">
          <ion-icon name="calendar-outline"></ion-icon>
          <span class="finance-period-trigger-copy">
            <strong data-finance-period-label>September 2026</strong>
          </span>
        </span>
        <ion-icon name="chevron-down-outline"></ion-icon>
      </button>
    </div>

    <section class="kartu-analisis-detail daftar-transaksi-card">
      <div class="judul-seksi-detail judul-seksi-transaksi">
        <div>
          <h2>Daftar Transaksi</h2>
          <p data-subjudul-transaksi>Mengambil transaksi...</p>
        </div>
      </div>
      <div class="daftar-transaksi-detail" data-transaksi-dompet></div>
    </section>
  </main>

  <a class="fab-detail-dompet" href="transaksi.html" data-tambah-transaksi-detail aria-label="Tambah transaksi"><ion-icon name="add-outline"></ion-icon></a>
</div>

<div class="lapisan" id="sheet-dompet-detail" hidden>
  <section class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2>Pilih Dompet</h2>
      <button class="tombol-ikon" type="button" data-detail-tutup-dompet><ion-icon name="close-outline"></ion-icon></button>
    </div>
    <div data-detail-daftar-dompet></div>
  </section>
</div>

<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/backend/supabase.js"></script>
<script src="js/backend/auth-service.js"></script>
<script src="js/backend/family-service.js"></script>
<script src="js/backend/finance-service.js?v=20260908-2"></script>
<script src="js/backend/finance-cache.js"></script>
<script src="js/backend/auth-router.js"></script>
<script src="js/backend/auth-guard.js"></script>
<script src="js/components/finance-period.js?v=20260908-1"></script>
<script src="js/pages/dompet-detail-backend.js?v=20260908-2"></script>
<script src="js/pwa.js"></script>
</body>
</html>
