<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0D0C">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Offline — Family Superapp</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0B0D0C;color:#F1F3F0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,430px);padding:32px;border:1px solid rgba(241,243,240,.1);border-radius:24px;background:#1B1D1C}
    .icon{width:56px;height:56px;display:grid;place-items:center;border-radius:18px;background:rgba(55,201,97,.12);color:#52D477;font-size:28px;margin-bottom:20px}
    h1{margin:0 0 10px;font-size:26px}
    p{margin:0 0 22px;color:rgba(241,243,240,.65);line-height:1.6}
    button{width:100%;border:0;border-radius:14px;padding:14px 18px;background:#37C961;color:#071109;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">⌁</div>
    <h1>Kamu sedang offline</h1>
    <p>Family Superapp membutuhkan koneksi internet untuk login dan menyinkronkan data keluarga. Sambungkan internet lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba Lagi</button>
  </main>
</body>
</html>
