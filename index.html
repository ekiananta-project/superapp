  <meta name="mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex,nofollow,noarchive">

  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <script src="js/theme.js"></script>

  <link rel="preconnect" href="https://eipviruaffujxsfpupki.supabase.co" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    .pilihan-sheet-tambah-dompet {
      margin-top: 8px;
      border-top: 1px solid var(--color-border);
      border-bottom: 0;
      text-decoration: none;
    }
    .pilihan-sheet-tambah-dompet .pilihan-sheet-panah {
      margin-left: auto;
      color: var(--color-text-secondary);
      font-size: 20px;
    }
  </style>
</head>
<body>
<div class="aplikasi dengan-nav home-hydrating" data-home-root aria-busy="true">
  <header class="kepala-aplikasi">
    <div class="sapaan">
      <h1>Halo, <span data-nama-pengguna class="home-hydrate-name" aria-live="polite"></span></h1>
      <p class="sapaan-quote">
        <span data-quote-teks>Hayo, bulan ini uangnya ke mana aja?</span>
        <span class="sapaan-quote-emoji" data-quote-emoji aria-hidden="true">👀</span>
      </p>
    </div>
    <a class="tombol-profil" href="pengaturan.html" aria-label="Buka profil dan pengaturan">
      <span data-avatar-pengguna data-avatar-fallback="icon" class="home-hydrate-avatar is-avatar-loading" aria-hidden="true"></span>
    </a>
  </header>

  <section class="ringkasan-saldo">
    <article class="kartu-uang">
      <span class="kartu-uang-ikon"><ion-icon name="wallet-outline"></ion-icon></span>
      <div class="kartu-uang-info">
        <p>Total Semua Dompet</p>
        <strong data-total-global class="home-hydrate-money"></strong>
      </div>
    </article>

    <button class="kartu-uang" type="button" data-buka-dompet>
      <span class="kartu-uang-ikon"><ion-icon data-dompet-ikon name="cash-outline"></ion-icon></span>
      <span class="kartu-uang-info">
        <span data-dompet-label class="home-hydrate-label"></span>
        <strong data-dompet-saldo class="home-hydrate-money"></strong>
      </span>
      <ion-icon class="kartu-uang-chevron" name="chevron-down-outline"></ion-icon>
    </button>
  </section>

  <div class="aksi-dompet-aktif">
    <a class="tombol-detail-dompet" href="dompet-detail.html" data-daftar-transaksi>
      <span class="tombol-detail-dompet-kiri">
        <ion-icon name="receipt-outline" aria-hidden="true"></ion-icon>
        <span>Daftar Transaksi</span>
      </span>
      <ion-icon class="tombol-detail-dompet-panah" name="arrow-forward-outline" aria-hidden="true"></ion-icon>
    </a>
  </div>

  <main class="home-finance-summary">
    <button class="finance-period-trigger" type="button" data-finance-period-trigger>
      <span class="finance-period-trigger-main">
        <ion-icon name="calendar-outline"></ion-icon>
        <span class="finance-period-trigger-copy">
          <small>Periode</small>
          <strong data-finance-period-label>September 2026</strong>
        </span>
      </span>
      <ion-icon name="chevron-down-outline"></ion-icon>
    </button>

    <section class="home-cash-summary" aria-label="Ringkasan arus kas">
      <article class="home-cash-card pemasukan">
        <span class="home-cash-icon"><ion-icon name="arrow-down-outline"></ion-icon></span>
        <span>Pemasukan</span>
        <strong data-home-pemasukan class="home-hydrate-summary">Rp 0</strong>
      </article>

      <article class="home-cash-card pengeluaran">
        <span class="home-cash-icon"><ion-icon name="arrow-up-outline"></ion-icon></span>
        <span>Pengeluaran</span>
        <strong data-home-pengeluaran class="home-hydrate-summary">Rp 0</strong>
      </article>
    </section>

    <section class="home-report-entry" aria-label="Laporan keuangan">
      <a class="home-report-link" href="laporan.html">
        <span class="home-report-icon"><ion-icon name="analytics-outline" aria-hidden="true"></ion-icon></span>
        <span class="home-report-copy">
          <strong>Laporan &amp; Insight</strong>
          <span>Lihat arus kas, kategori, budget, tagihan, dan posisi dompet.</span>
        </span>
        <ion-icon name="chevron-forward-outline" aria-hidden="true"></ion-icon>
      </a>
    </section>
  </main>

  <nav class="navigasi-bawah finance-nav-v5" aria-label="Navigasi Finance">
    <a class="navigasi-item is-aktif" href="index.html" aria-current="page"><ion-icon name="home-outline"></ion-icon><span>Home</span></a>
    <a class="navigasi-item" href="perencanaan.html"><ion-icon name="calendar-outline"></ion-icon><span>Perencanaan</span></a>
    <a class="tombol-tambah" href="transaksi.html" aria-label="Tambah transaksi"><ion-icon name="add-outline"></ion-icon></a>
    <a class="navigasi-item" href="akun.html"><ion-icon name="grid-outline"></ion-icon><span>Kategori</span></a>
    <a class="navigasi-item" href="dompet.html"><ion-icon name="wallet-outline"></ion-icon><span>Dompet</span></a>
  </nav>
</div>

<div class="lapisan" id="sheet-dompet" hidden>
  <section class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2>Pilih Dompet</h2>
      <button class="tombol-ikon" type="button" data-sheet-close="sheet-dompet"><ion-icon name="close-outline"></ion-icon></button>
    </div>
    <div data-sheet-dompet-list></div>
    <a class="pilihan-sheet pilihan-sheet-tambah-dompet" href="dompet-form.html" aria-label="Tambah dompet baru">
      <ion-icon name="add-circle-outline" aria-hidden="true"></ion-icon>
      <span><strong>Tambah Dompet</strong><br><small>Buat dompet baru</small></span>
      <ion-icon class="pilihan-sheet-panah" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
    </a>
  </section>
</div>

<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>

<script>window.HOME_BACKEND_MODE = true;</script>

</body>
