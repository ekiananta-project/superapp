<!DOCTYPE html>
<html lang="id" data-auth-guard="family">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0D0C">
  <meta name="application-name" content="RuangKitha">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RuangKitha">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <script src="js/theme.js"></script>
  <title>Dompet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages/dompet-form.css">
  <link rel="stylesheet" href="css/pages/dompet-backend.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div class="aplikasi">
  <header class="header-halaman">
    <a class="tombol-ikon" href="dompet.html" aria-label="Kembali" data-kembali-dompet><ion-icon name="arrow-back-outline"></ion-icon></a>
    <h1><span data-judul-form>Dompet</span></h1>
    <script>
      (() => {
        const el = document.querySelector("[data-judul-form]");
        const params = new URLSearchParams(location.search);
        if (!el) return;
        el.textContent = params.get("id")
          ? "Edit Dompet"
          : (params.get("setup") === "awal" ? "Siapkan Dompet Pertamamu" : "Tambah Dompet");
      })();
    </script>
    <span class="kosong"></span>
  </header>

  <main class="konten-halaman">
    <div class="notifikasi" data-notifikasi hidden></div>

    <section class="setup-dompet" data-setup-dompet hidden>
      <span class="setup-dompet-ikon">
        <ion-icon name="wallet-outline" aria-hidden="true"></ion-icon>
      </span>
      <div>
        <h2>Mulai dari satu dompet</h2>
        <p>Tambahkan tempat penyimpanan uang pertamamu. Bisa berupa Cash, rekening bank, atau E-Wallet.</p>
      </div>
    </section>

    <form class="formulir" data-form-dompet>
      <div class="grup-input">
        <label for="nama">Nama Dompet</label>
        <input class="input" id="nama" name="nama" maxlength="80" placeholder="Contoh: BCA" required>
      </div>

      <div class="grup-input">
        <label for="jenis">Jenis Dompet</label>
        <select class="pilih" id="jenis" name="jenis">
          <option value="cash">Cash</option>
          <option value="bank">Bank</option>
          <option value="ewallet">E-Wallet</option>
          <option value="other">Lainnya</option>
        </select>
      </div>

      <div class="grup-input">
        <label for="saldo" data-label-saldo>Saldo Awal</label>
        <div class="input-uang"><span class="input-uang-prefix">Rp</span><input class="input" id="saldo" name="saldo" type="text" inputmode="numeric" autocomplete="off" value="0"></div>
        <small class="bantuan-input" data-bantuan-saldo>
          Saldo awal hanya dipakai saat membuat dompet baru.
        </small>
      </div>

      <div class="grup-input">
        <label for="ikon">Ikon</label>
        <select class="pilih" id="ikon" name="ikon">
          <option value="cash-outline">Cash</option>
          <option value="card-outline">Kartu / Bank</option>
          <option value="wallet-outline">Wallet</option>
          <option value="phone-portrait-outline">E-Wallet</option>
        </select>
      </div>

      <button class="tombol-utama" type="submit" data-simpan-dompet>Simpan Dompet</button>
      <button class="tombol-bahaya" type="button" data-hapus-dompet hidden>Arsipkan Dompet</button>
    </form>
  </main>
</div>

<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/backend/supabase.js"></script>
<script src="js/backend/auth-service.js"></script>
<script src="js/backend/family-service.js"></script>
<script src="js/backend/finance-service.js"></script>
<script src="js/backend/finance-cache.js"></script>
<script src="js/backend/auth-router.js"></script>
<script src="js/backend/auth-guard.js"></script>
<script src="js/pages/dompet-form-backend.js?v=20260909-v200a"></script>
<script src="js/pwa.js?v=20260909-v200a7"></script>
</body>
</html>
